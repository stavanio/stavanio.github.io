<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noimageindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#14241D">
<title>Gallery &middot; Stavan Dholakia</title>
<link rel="canonical" href="https://stavan.io/gallery/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231C2922'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' text-anchor='middle' fill='%23F3EFE7'%3ES%3C/text%3E%3C/svg%3E">
<style>
:root{--paper:#F3EFE7;--ink:#1C2922;--ink-2:#4A564F;--rule:#D8D1C4;--copper:#A2502A;--deep:#14241D;--deep-rule:#2F4339;--on-deep:#ECE7DD;--on-deep-2:#B9C2BB;--copper-l:#D9875C;
  --serif:"Iowan Old Style","Palatino Linotype","URW Palladio L",P052,Charter,"Bitstream Charter",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --wrap:1180px;--gutter:clamp(20px,5vw,56px)}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 var(--sans);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
h1,h2{margin:0;font-family:var(--serif);font-weight:400;letter-spacing:-.015em}
p,figure{margin:0}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.22em;text-decoration-color:var(--copper)}
a:hover{color:var(--copper)}
:focus-visible{outline:2px solid var(--copper);outline-offset:3px}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gutter)}
.label{font:500 .72rem/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.top{background:var(--deep);color:var(--on-deep)}
.top .label{color:var(--on-deep-2)}
.mast{display:flex;justify-content:space-between;align-items:baseline;padding-block:1.4rem;border-bottom:1px solid var(--deep-rule)}
.mast a{text-decoration:none}
.head{padding-block:clamp(3rem,7vw,5rem)}
.head p{margin-bottom:1rem;color:var(--copper-l)}
.head h1{font-size:clamp(2.6rem,7vw,5rem);line-height:.95;letter-spacing:-.03em}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2.5rem 2rem;padding-block:clamp(3rem,7vw,5rem)}
.g figcaption{margin-top:.8rem;font-size:.92rem;line-height:1.45;color:var(--ink-2)}
.g figcaption .label{display:block;margin-bottom:.3rem;color:var(--ink)}
.g img{width:100%;height:auto;background:var(--rule)}
.g1{grid-column:1/7;grid-row:1/3}
.g2{grid-column:7/13}
.g3{grid-column:7/13}
.g3 img{aspect-ratio:4/3;object-fit:cover;object-position:50% 45%}
.foot{padding-block:2rem 2.5rem;border-top:1px solid var(--rule);font-size:.85rem;color:var(--ink-2)}
@media (max-width:760px){.g1,.g2,.g3{grid-column:1/-1;grid-row:auto}.g3 img{aspect-ratio:auto}}
</style>
</head>
<body>
<div class="top">
  <header class="wrap mast">
    <a class="label" href="/">stavan.io</a>
    <a class="label" href="/">Back to profile</a>
  </header>
  <div class="wrap head">
    <p class="label">Gallery</p>
    <h1>The real hardware</h1>
  </div>
</div>
<main class="wrap grid">
  <figure class="g g1">
    <img src="/assets/gallery/mefferdi-vehicle.webp" alt="Mefferdi subsea vehicle on a pool deck, with thrusters, lights, and camera housings at the front" width="1400" height="1867" decoding="async">
    <figcaption><span class="label">Mefferdi vehicle</span>Poolside, between test runs.</figcaption>
  </figure>
  <figure class="g g2">
    <img src="/assets/gallery/b601-arm.webp" alt="B601 robotic arm reaching toward a small box on a black tabletop" width="1800" height="1013" loading="lazy" decoding="async">
    <figcaption><span class="label">B601 arm</span>CAN-bus motors, custom joint-level control at 200 Hz.</figcaption>
  </figure>
  <figure class="g g3">
    <img src="/assets/gallery/yahboom-rover.webp" alt="Yahboom mecanum-wheel rover on a taped line, facing everyday objects on a wooden floor" width="1069" height="1900" loading="lazy" decoding="async">
    <figcaption><span class="label">Yahboom rover</span>A perception and mapping test course at home.</figcaption>
  </figure>
</main>
<footer class="wrap foot"><p><a href="/">stavan.io</a> &middot; &copy; 2026 Stavan Dholakia</p></footer>
</body>
</html>
